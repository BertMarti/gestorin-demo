    <text x="64" y="256" font-size="15" font-weight="600" fill="#1e3a6b" letter-spacing="1.5">IDENTIDAD · VEHÍCULO · HOGAR · SALUD · HACIENDA</text>
  </g>
  <g transform="translate(790 58)" font-family="'Public Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
