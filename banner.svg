<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Gestorín</title>
  <desc id="d">Tu papeleo, en orden: qué es, cuánto pagas y para cuándo. Para Windows y Android.</desc>
  <rect width="1200" height="300" fill="#f3efe6"/>
  <rect x="0" y="0" width="1200" height="4" fill="#1b1a17"/>
  <!-- Texto a la izquierda (hasta x≈640, con letra de reserva incluida); tarjeta a la derecha (desde x=790): no se tocan. -->
  <g transform="translate(64 64)">
    <rect width="36" height="48" rx="2" fill="none" stroke="#1b1a17" stroke-width="3"/>
    <path d="M8 14h20M8 22h20M8 30h12" stroke="#1b1a17" stroke-width="3" stroke-linecap="square"/>
    <circle cx="28" cy="38" r="4" fill="#1e3a6b"/>
  </g>
  <text x="118" y="106" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="58" font-weight="500" fill="#1b1a17" letter-spacing="-1">Gestorín</text>
  <g font-family="'Public Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#55504a">
