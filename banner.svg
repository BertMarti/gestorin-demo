    <text x="20" y="104" font-family="Newsreader, Georgia, serif" font-size="50" fill="#b3261e">2</text>
    <text x="22" y="124" font-size="13" fill="#55504a">días</text>
    <rect x="22" y="128" width="30" height="3" fill="#b3261e"/>
    <text x="84" y="84" font-size="16" font-weight="600" fill="#1b1a17">Pagar antes del 14 nov</text>
    <text x="84" y="106" font-size="13" fill="#55504a">Multa · con descuento</text>
